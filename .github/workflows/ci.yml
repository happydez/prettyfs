name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      
      - name: Install Task
        uses: arduino/setup-task@v2
      
      - name: Run lint
        run: task lint
      
      - name: Run tests
        run: task test